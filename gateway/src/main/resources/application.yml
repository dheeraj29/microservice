server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
            - "http://localhost:4200"
            - "http://localhost:8080"
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
      - id: adminservice
        predicates:
        - Path=/adminservice/**
        uri: lb://adminservice
      - id: bookingservice
        predicates:
        - Path=/bookingservice/**
        uri: lb://bookingservice
      - id: inventoryservice
        predicates:
        - Path=/inventoryservice/**
        uri: lb://inventoryservice
      - id: paymentservice
        predicates:
        - Path=/paymentservice/**
        uri: lb://paymentservice
      - id: angular-frontend
        predicates:
        - Path=/**
        uri: http://localhost:4200
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  main:
    allow-bean-definition-overriding: true

keycloak:
  auth-server-url: http://localhost:8088
  realm: bus-reservation
  client-id: angular-client

app:
  frontend-url: http://localhost:4200

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10