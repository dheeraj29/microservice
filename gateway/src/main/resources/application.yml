server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    loadbalancer:
      cache:
        ttl: 2s
        capacity: 256
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                - "http://localhost:4200"
                - "http://localhost:8080"
                allowed-methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
          - id: auth-endpoints
            predicates:
            - Path=/auth/**
            uri: lb://adminservice
          - id: adminservice
            predicates:
            - Path=/adminservice/**
            uri: lb://adminservice
          - id: bookingservice
            predicates:
            - Path=/bookingservice/**
            uri: lb://bookingservice
          - id: inventoryservice
            predicates:
            - Path=/inventoryservice/**
            uri: lb://inventoryservice
          - id: paymentservice
            predicates:
            - Path=/paymentservice/**
            uri: lb://paymentservice
          - id: angular-frontend
            predicates:
            - Path=/**
            uri: http://localhost:4200
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: 2
  instance:
    prefer-ip-address: true
    initial-status: STARTING
    lease-renewal-interval-in-seconds: 2
    lease-expiration-duration-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus