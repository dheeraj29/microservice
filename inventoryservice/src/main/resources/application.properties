spring.application.name=inventoryservice
server.port=8084

spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

rabbit.exchange.name=bus-exchange
rabbit.inventory.queuename=inventory-queue
rabbit.inventory.routekey=inventory-key
rabbit.booking.queuename=booking-queue
rabbit.booking.routekey=booking-key
rabbit.payment.queuename=payment-queue
rabbit.payment.routekey=payment-key

# Decentralized Valkey & Keycloak Configuration (Embedded BFF)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

keycloak.auth-server-url=http://localhost:8088
keycloak.realm=bus-reservation
keycloak.client-id=angular-client
keycloak.resource=internal-backend-client
keycloak.credentials.secret=${KEYCLOAK_INTERNAL_SECRET:internal-service-mesh-secret-key-123}

# Swagger UI OAuth Auto-Configuration
springdoc.swagger-ui.oauth.client-id=angular-client
springdoc.swagger-ui.oauth.scopes=openid,profile,roles
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=false