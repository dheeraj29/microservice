# ==============================================================================
# OmniBus Centralized Platform Properties (Shared Across All Microservices)
# ==============================================================================

# Cloud Config Server (Optional for Local Dev)
spring.config.import=optional:configserver:
spring.cloud.config.enabled=false

# ------------------------------------------------------------------------------
# 1. Netflix Eureka Discovery Client (HealthCheck-Bound Registration)
# ------------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.prefer-ip-address=true
eureka.instance.initial-status=STARTING
eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=6

# ------------------------------------------------------------------------------
# 2. Valkey / Redis Distributed Session Cache (Embedded BFF)
# ------------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ------------------------------------------------------------------------------
# 3. Keycloak IAM & OIDC Provider
# ------------------------------------------------------------------------------
keycloak.auth-server-url=http://localhost:8088
keycloak.realm=bus-reservation
keycloak.client-id=angular-client
keycloak.resource=internal-backend-client
keycloak.credentials.secret=${KEYCLOAK_INTERNAL_SECRET:internal-service-mesh-secret-key-123}

# ------------------------------------------------------------------------------
# 4. OpenAPI 3.0 / Swagger UI OAuth + PKCE Auto-Configuration
# ------------------------------------------------------------------------------
springdoc.swagger-ui.oauth.client-id=angular-client
springdoc.swagger-ui.oauth.scopes=openid,profile,roles
springdoc.swagger-ui.oauth.use-basic-authentication-with-access-code-grant=false
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------------------------------------------------
# 5. Spring Boot Actuator Endpoints & Telemetry
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ------------------------------------------------------------------------------
# 6. RabbitMQ AMQP Topology Defaults
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

rabbit.exchange.name=bus-exchange
rabbit.inventory.queuename=inventory-queue
rabbit.inventory.routekey=inventory-key
rabbit.booking.queuename=booking-queue
rabbit.booking.routekey=booking-key
rabbit.payment.queuename=payment-queue
rabbit.payment.routekey=payment-key

# ------------------------------------------------------------------------------
# 7. Model Context Protocol (MCP) OAuth2 & Keycloak Security Settings
# ------------------------------------------------------------------------------
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.transport=sse
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8088/realms/bus-reservation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8088/realms/bus-reservation/protocol/openid-connect/certs
