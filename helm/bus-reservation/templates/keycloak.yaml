{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
    app: keycloak
data:
  realm-export.json: |
    {{- .Files.Get "files/realm-export.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password }}
          ports:
            - containerPort: {{ .Values.postgresql.service.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
    app: postgresql
spec:
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
  selector:
    app: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.adminUser }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.keycloak.adminPassword }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgresql:5432/{{ .Values.postgresql.database }}
            - name: KC_DB_USERNAME
              value: {{ .Values.postgresql.username }}
            - name: KC_DB_PASSWORD
              value: {{ .Values.postgresql.password }}
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: {{ .Values.keycloak.service.port }}
              name: http
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
    app: keycloak
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.keycloak.service.port }}
      targetPort: http
      name: http
  selector:
    app: keycloak
{{- end }}
