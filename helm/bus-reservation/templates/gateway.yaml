{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: bus-gateway
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.service.port }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bus-routes
  labels:
    {{- include "bus-reservation.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: bus-gateway
  rules:
    # 1. Admin Service Routing
    - matches:
        - path:
            type: PathPrefix
            value: /adminservice/
      backendRefs:
        - name: adminservice
          port: 8081

    # 2. Booking Service Routing
    - matches:
        - path:
            type: PathPrefix
            value: /bookingservice/
      backendRefs:
        - name: bookingservice
          port: 8083

    # 3. Inventory Service Routing
    - matches:
        - path:
            type: PathPrefix
            value: /inventoryservice/
      backendRefs:
        - name: inventoryservice
          port: 8084

    # 4. Payment Service Routing
    - matches:
        - path:
            type: PathPrefix
            value: /paymentservice/
      backendRefs:
        - name: paymentservice
          port: 8085

    # 5. Keycloak Auth Routing
    - matches:
        - path:
            type: PathPrefix
            value: /realms/
      backendRefs:
        - name: keycloak
          port: 8080

    # 6. Default Frontend UI
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
