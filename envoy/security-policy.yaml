apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: omnibus-cors-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: omnibus-http-routes
  cors:
    allowOrigins:
      - "http://localhost:4200"
      - "https://app.omnibus.local"
    allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowHeaders:
      - DNT
      - User-Agent
      - X-Requested-With
      - If-Modified-Since
      - Cache-Control
      - Content-Type
      - Range
      - Authorization
      - Mcp-Session-Id
    exposeHeaders:
      - Mcp-Session-Id
      - Set-Cookie
    allowCredentials: true
    maxAge: 86400s
