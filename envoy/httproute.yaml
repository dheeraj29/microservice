apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omnibus-http-routes
  namespace: default
spec:
  parentRefs:
    - name: omnibus-gateway
      namespace: default
  rules:
    # 1. Admin Microservice
    - matches:
        - path:
            type: PathPrefix
            value: /adminservice/
      backendRefs:
        - name: adminservice
          port: 8081

    # 2. Booking Microservice
    - matches:
        - path:
            type: PathPrefix
            value: /bookingservice/
      backendRefs:
        - name: bookingservice
          port: 8083

    # 3. Inventory Microservice
    - matches:
        - path:
            type: PathPrefix
            value: /inventoryservice/
      backendRefs:
        - name: inventoryservice
          port: 8084

    # 4. Payment Microservice
    - matches:
        - path:
            type: PathPrefix
            value: /paymentservice/
      backendRefs:
        - name: paymentservice
          port: 8085

    # 5. Keycloak Public Interactive & IDP Federation Endpoints
    # Supports local Keycloak login, Azure Entra ID / Okta broker redirects, and theme assets.
    # NOTE: /protocol/openid-connect/token is intentionally NOT exposed here.
    # It remains 100% internal (ClusterIP only) for BFF & M2M back-channel exchanges!
    - matches:
        - path:
            type: PathPrefix
            value: /realms/bus-reservation/protocol/openid-connect/auth
        - path:
            type: PathPrefix
            value: /realms/bus-reservation/protocol/openid-connect/logout
        - path:
            type: PathPrefix
            value: /realms/bus-reservation/broker/
        - path:
            type: PathPrefix
            value: /realms/bus-reservation/login-actions/
        - path:
            type: PathPrefix
            value: /resources/
      backendRefs:
        - name: keycloak
          port: 8080

    # 6. Default Frontend SPA
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
