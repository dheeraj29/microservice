static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_services
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              google_re2: {}
                              regex: ".*"
                        allow_methods: "GET, POST, PUT, DELETE, OPTIONS, HEAD, PATCH"
                        allow_headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-XSRF-TOKEN"
                        allow_credentials: true
                        max_age: "1728000"
                      routes:
                        # 1. Adminservice Routing
                        - match:
                            prefix: "/adminservice/"
                          route:
                            cluster: adminservice_cluster
                            timeout: 10s

                        # 2. Bookingservice Routing
                        - match:
                            prefix: "/bookingservice/"
                          route:
                            cluster: bookingservice_cluster
                            timeout: 10s

                        # 3. Inventoryservice Routing
                        - match:
                            prefix: "/inventoryservice/"
                          route:
                            cluster: inventoryservice_cluster
                            timeout: 10s

                        # 4. Paymentservice Routing
                        - match:
                            prefix: "/paymentservice/"
                          route:
                            cluster: paymentservice_cluster
                            timeout: 10s

                        # 5. Keycloak Auth Routing
                        - match:
                            prefix: "/realms/"
                          route:
                            cluster: keycloak_cluster
                            timeout: 15s

                        # 6. Default Frontend UI Routing
                        - match:
                            prefix: "/"
                          route:
                            cluster: frontend_cluster
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: adminservice_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: adminservice_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: adminservice
                      port_value: 8081

    - name: bookingservice_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: bookingservice_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: bookingservice
                      port_value: 8083

    - name: inventoryservice_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: inventoryservice_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: inventoryservice
                      port_value: 8084

    - name: paymentservice_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: paymentservice_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: paymentservice
                      port_value: 8085

    - name: keycloak_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: keycloak_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8080

    - name: frontend_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: frontend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: frontend
                      port_value: 80
