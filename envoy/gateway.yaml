apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: omnibus-gateway
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: omnibus-tls-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: omnibus-ai-gateway
  namespace: default
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: mcp-http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
